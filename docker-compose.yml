services:
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    ports:
      - "8880:8880"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  # User store for authentication. Internal only — no published port, reachable
  # by the api service as host "mongo" on the default Docker network.
  mongo:
    image: mongo:7
    volumes:
      - ./mongo_storage:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./.cache/huggingface:/root/.cache/huggingface
    depends_on:
      - kokoro
      - qdrant
      - mongo
    env_file:
      - .env
    environment:
      KOKORO_ENDPOINT: http://kokoro:8880/v1/audio/speech
      KOKORO_DEFAULT_VOICE: ${KOKORO_DEFAULT_VOICE:-af_heart}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      QDRANT_URL: http://qdrant:6333
      MONGO_URL: mongodb://mongo:27017
    ports:
      - "${VOICE_API_PORT:-8000}:8000"
